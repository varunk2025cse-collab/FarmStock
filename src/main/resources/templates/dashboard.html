<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmStock - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Dashboard</h1>

    <div class="cards">
        <div class="card">
            <p class="card-title">Total Crops</p>
            <p class="card-value" th:text="${totalCrops}"></p>
        </div>
        <div class="card">
            <p class="card-title">Total Harvested</p>
            <p class="card-value" th:text="${totalHarvested} + ' kg'"></p>
        </div>
        <div class="card">
            <p class="card-title">Total Sold</p>
            <p class="card-value" th:text="${totalSold} + ' kg'"></p>
        </div>
        <div class="card">
            <p class="card-title">Current Stock</p>
            <p class="card-value" th:text="${currentStock} + ' kg'"></p>
        </div>
        <div class="card">
            <p class="card-title">Total Revenue</p>
            <p class="card-value" th:text="'₹ ' + ${#numbers.formatDecimal(totalRevenue, 1, 2)}"></p>
        </div>
    </div>
</main>

</body>
</html>
