<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmStock - Sales</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Sales</h1>

    <div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- Record sale form -->
    <div class="form-box">
        <h2>Record Sale</h2>

        <p class="empty" th:if="${#lists.isEmpty(crops)}">
            Please add a crop first on the Crops page.
        </p>

        <form th:action="@{/sales}" method="post" th:unless="${#lists.isEmpty(crops)}">
            <div class="form-row">
                <div class="form-group">
                    <label for="crop">Crop</label>
                    <!-- Crop list comes from the database -->
                    <select id="crop" name="crop.id" required>
                        <option value="">-- Select crop --</option>
                        <option th:each="crop : ${crops}"
                                th:value="${crop.id}"
                                th:text="${crop.name}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity (kg)</label>
                    <input type="number" id="quantity" name="quantity" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="pricePerUnit">Price per kg (₹)</label>
                    <input type="number" id="pricePerUnit" name="pricePerUnit" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="saleDate">Sale Date</label>
                    <input type="date" id="saleDate" name="saleDate" required>
                </div>
                <div>
                    <button type="submit" class="btn">Save Sale</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Sales table -->
    <h2>All Sales</h2>
    <p class="empty" th:if="${#lists.isEmpty(sales)}">No sales recorded yet.</p>

    <div class="table-box" th:unless="${#lists.isEmpty(sales)}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Crop</th>
                <th>Quantity (kg)</th>
                <th>Price per kg (₹)</th>
                <th>Sale Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="sale : ${sales}">
                <td th:text="${sale.id}"></td>
                <td th:text="${sale.crop.name}"></td>
                <td th:text="${sale.quantity}"></td>
                <td th:text="${#numbers.formatDecimal(sale.pricePerUnit, 1, 2)}"></td>
                <td th:text="${sale.saleDate}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
