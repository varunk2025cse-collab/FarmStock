<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmStock - Revenue</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Revenue Report</h1>

    <div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- Report form -->
    <div class="form-box">
        <p class="empty" th:if="${#lists.isEmpty(crops)}">
            Please add a crop first on the Crops page.
        </p>

        <form th:action="@{/revenue}" method="get" th:unless="${#lists.isEmpty(crops)}">
            <div class="form-row">
                <div class="form-group">
                    <label for="cropId">Crop</label>
                    <!-- Crop list comes from the database -->
                    <select id="cropId" name="cropId" required>
                        <option value="">-- Select crop --</option>
                        <option th:each="crop : ${crops}"
                                th:value="${crop.id}"
                                th:text="${crop.name}"
                                th:selected="${selectedCrop != null and selectedCrop.id == crop.id}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="from">From Date</label>
                    <input type="date" id="from" name="from" th:value="${from}" required>
                </div>
                <div class="form-group">
                    <label for="to">To Date</label>
                    <input type="date" id="to" name="to" th:value="${to}" required>
                </div>
                <div>
                    <button type="submit" class="btn">Generate Report</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Report result (only shown after the form is submitted) -->
    <div th:if="${selectedCrop != null}">
        <div class="cards">
            <div class="card">
                <p class="card-title">Crop</p>
                <p class="card-value" th:text="${selectedCrop.name}"></p>
            </div>
            <div class="card">
                <p class="card-title">Date Range</p>
                <p class="card-value" th:text="${from} + ' to ' + ${to}"></p>
            </div>
            <div class="card">
                <p class="card-title">Total Quantity Sold</p>
                <p class="card-value" th:text="${totalQuantity} + ' kg'"></p>
            </div>
            <div class="card">
                <p class="card-title">Total Revenue</p>
                <p class="card-value" th:text="'₹ ' + ${#numbers.formatDecimal(totalRevenue, 1, 2)}"></p>
            </div>
        </div>

        <h2>Sales in this range</h2>
        <p class="empty" th:if="${#lists.isEmpty(sales)}">No sales found for this crop in this date range.</p>

        <div class="table-box" th:unless="${#lists.isEmpty(sales)}">
            <table>
                <thead>
                <tr>
                    <th>Sale ID</th>
                    <th>Quantity (kg)</th>
                    <th>Price per kg (₹)</th>
                    <th>Sale Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sale : ${sales}">
                    <td th:text="${sale.id}"></td>
                    <td th:text="${sale.quantity}"></td>
                    <td th:text="${#numbers.formatDecimal(sale.pricePerUnit, 1, 2)}"></td>
                    <td th:text="${sale.saleDate}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
